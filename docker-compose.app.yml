# Pitchbox client stack (cloud edition) - base compose for the app (web + daemon).
# Layers on the postgres service in docker-compose.yml. The web dispatches every
# run to the in-process SDK runner, which reaches models through the AI Gateway -
# this stack holds the data and is the only compute there is.
#
#   dev :  docker compose -f docker-compose.yml -f docker-compose.app.yml -f docker-compose.app.dev.yml up
#   prod:  docker compose -f docker-compose.yml -f docker-compose.app.yml -f docker-compose.app.prod.yml up -d
#
# Parametric via .env (see .env.docker.example). Local-runner users run the app
# WITHOUT Docker (pnpm dev) - this image is cloud-edition only.
name: pitchbox

services:
  web:
    image: ${APP_IMAGE:-pitchbox-app:latest}
    # PID 1 in this container would otherwise be node itself, which never reaps
    # children it did not await: tsx's esbuild helpers exit at boot and stay as
    # zombies (#218). tini forwards SIGTERM, so stop_grace_period still works.
    init: true
    build:
      context: .
      dockerfile: Dockerfile.app
    environment:
      # adapter-node (prod build) reads PORT; Vite (dev) reads WEB_PORT. Same value.
      PORT: ${WEB_PORT:-5180}
      WEB_PORT: ${WEB_PORT:-5180}
      PITCHBOX_ROOT: /app
      DATABASE_URL: ${DATABASE_URL:-postgresql://pitchbox:pitchbox@postgres:5432/pitchbox}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      # The daemon's own POST /api/run dispatch (#378). Only the daemon needs
      # to send it, but the web has to know it to accept it, so both services
      # read the same value. Empty by default, which leaves that route exactly
      # as closed as every other /api/* route - and, with PITCHBOX_AUTH=on,
      # leaves scheduled campaigns unable to dispatch, so it is required in
      # any deployment that turns auth on.
      PITCHBOX_INTERNAL_TOKEN: ${PITCHBOX_INTERNAL_TOKEN:-}
      # Cloud edition: dispatch runs to the in-process SDK runner.
      PITCHBOX_EDITION: cloud
      # The SDK runner's only remote - reaches every model through the AI Gateway.
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?set AI_GATEWAY_API_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.WEB_PORT||5180)+'/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  daemon:
    image: ${APP_IMAGE:-pitchbox-app:latest}
    init: true
    # Scheduler + reply poller. Runs the TS source under tsx (no build needed).
    command: ['node', '--import', 'tsx', 'daemon/src/index.ts']
    environment:
      PITCHBOX_ROOT: /app
      DATABASE_URL: ${DATABASE_URL:-postgresql://pitchbox:pitchbox@postgres:5432/pitchbox}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      # Same value as the web service above, and for the same reason (#378).
      PITCHBOX_INTERNAL_TOKEN: ${PITCHBOX_INTERNAL_TOKEN:-}
      # Reaches the web app over the compose network to trigger scheduled runs.
      PITCHBOX_WEB_URL: http://web:${WEB_PORT:-5180}
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
