name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref per event; new pushes cancel the old run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PR-only. dorny/paths-filter answers from the API on a pull_request, so
  # this job needs no checkout. Not used on push: main always runs everything.
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'web/**'
              - 'cli/**'
              - 'daemon/**'
              - 'extension/**'
              - 'shared/**'
              - 'tests/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
              - 'vitest*.config.ts'

  # Tier 2: cheap, scoped, runs on a PR and again on main. Skipped entirely
  # for a diff that can't touch it (docs, playbooks, README).
  quality:
    name: Lint · Typecheck · Build
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Workspace versions in lockstep (#207)
        run: pnpm run version:check
      - name: LinkedIn compliance boundary (#308)
        run: pnpm run test:linkedin-compliance
      - name: Lint (eslint + prettier)
        run: pnpm run lint
      - name: Typecheck (tsc + svelte-check)
        run: pnpm run typecheck
      - name: Build (web + extension)
        run: pnpm run build

  # Tier 3: heavy (5.2m), main only. Its PR-path replacement is the
  # `test-postgres` preflight check (.github/preflight.json) against a local,
  # disposable Postgres.
  test:
    name: Tests (Postgres)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pitchbox
          POSTGRES_PASSWORD: pitchbox
          POSTGRES_DB: pitchbox_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U pitchbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The test suite pins this same URL in vitest.config.ts; global-setup runs
      # migrate + seed against it. The other two are read by crypto / repo-locating
      # code that a few integration tests exercise.
      DATABASE_URL: postgres://pitchbox:pitchbox@127.0.0.1:5434/pitchbox_test
      ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      PITCHBOX_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test (vitest, full suite)
        run: pnpm test

  # The single required status check. Never rename it: it is the one context
  # in the ruleset, so the job names above it can change forever without
  # touching a ruleset again.
  ci:
    name: ci
    if: always()
    needs: [changes, quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A needed job failed or was cancelled
        run: |
          printf '%s\n' '${{ toJSON(needs) }}'
          printf '%s' '${{ toJSON(needs) }}' | jq -e '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | length == 0'
