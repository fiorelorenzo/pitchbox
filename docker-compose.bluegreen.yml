# Blue-green web tier. web-blue/web-green share the image and env; only one is
# "active" (Caddy points at its host port). The base `web` service is disabled
# here (a profile nothing activates) and the daemon's web dependency is dropped
# (!override) so it is not pulled back in; the daemon points at the active color
# via ACTIVE_WEB, set by deploy.sh at cutover.
x-web-common: &web-common
  image: ${APP_IMAGE:-pitchbox-app:latest}
  # tini as PID 1 so node is not left holding unreapable children (#218).
  init: true
  pull_policy: ${APP_PULL_POLICY:-build}
  build:
    context: .
    dockerfile: Dockerfile.app
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  mem_limit: ${WEB_MEM_LIMIT:-2g}
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    PORT: ${WEB_PORT:-5180}
    WEB_PORT: ${WEB_PORT:-5180}
    PITCHBOX_ROOT: /app
    DATABASE_URL: ${DATABASE_URL:-postgresql://pitchbox:pitchbox@postgres:5432/pitchbox}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
    # The daemon's own POST /api/run dispatch (#378). Declared here as well as
    # in docker-compose.app.yml's `web`, and that duplication is the point:
    # this overlay replaces the base service's whole `environment` block
    # through `x-web-common`, so a variable added only to the base never
    # reaches a blue-green deployment. Measured on preview 2026-09-08 - the
    # daemon had the token and the active web did not, which is a 401 with
    # both sides configured.
    PITCHBOX_INTERNAL_TOKEN: ${PITCHBOX_INTERNAL_TOKEN:-}
    PITCHBOX_EDITION: cloud
    # The SDK runner's only remote - reaches every model through the AI Gateway.
    AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?set AI_GATEWAY_API_KEY in .env}
    ORIGIN: ${PUBLIC_WEB_ORIGIN:-https://app.pitchbox.app}
    PITCHBOX_AUTH: ${PITCHBOX_AUTH:-off}
    PITCHBOX_OWNER_USERNAME: ${PITCHBOX_OWNER_USERNAME:-}
    PITCHBOX_OWNER_PASSWORD: ${PITCHBOX_OWNER_PASSWORD:-}
    # Outbound mail (#508, #514, #580), and here for the same reason as the
    # token above: a value added only to the base `web` never reaches a
    # blue-green deployment. Measured on prod 2026-09-09 - #579 added these
    # to the base service, the release went out, and the active web still
    # had no MAIL_PROVIDER, so a verified Resend domain and a real key sent
    # nothing.
    MAIL_PROVIDER: ${MAIL_PROVIDER:-}
    MAIL_FROM: ${MAIL_FROM:-}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-}
    SMTP_SECURE: ${SMTP_SECURE:-}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    # Optional GitHub App (#390), in this overlay for exactly the reason the
    # mail block above records: this anchor replaces the base service's whole
    # environment, so a credential added only to docker-compose.app.yml never
    # reaches the container a blue-green deploy actually runs.
    GITHUB_APP_ID: ${GITHUB_APP_ID:-}
    GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
    GITHUB_APP_PRIVATE_KEY_B64: ${GITHUB_APP_PRIVATE_KEY_B64:-}
    # Hosted billing (#549, #551), in this overlay for the same reason: this
    # anchor replaces the base service's whole environment, so the four
    # variables added to docker-compose.app.yml would reach nothing that
    # production actually runs.
    PITCHBOX_BILLING: ${PITCHBOX_BILLING:-}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    STRIPE_PORTAL_CONFIGURATION: ${STRIPE_PORTAL_CONFIGURATION:-}
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:'+(process.env.WEB_PORT||5180)+'/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
  web:
    profiles: ['_disabled']

  daemon:
    depends_on: !override
      postgres:
        condition: service_healthy
    environment:
      PITCHBOX_WEB_URL: http://${ACTIVE_WEB:-web-blue}:${WEB_PORT:-5180}

  web-blue:
    <<: *web-common
    container_name: pitchbox-web-blue
    ports: ['${APP_BIND:-127.0.0.1}:${BLUE_PORT:-5180}:${WEB_PORT:-5180}']

  web-green:
    <<: *web-common
    container_name: pitchbox-web-green
    ports: ['${APP_BIND:-127.0.0.1}:${GREEN_PORT:-5181}:${WEB_PORT:-5180}']
